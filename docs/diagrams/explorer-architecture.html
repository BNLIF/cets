<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HWDB Explorer architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · HWDB Explorer</p>
    <h1>How the HWDB Explorer is put together</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="explorer-architecture-title explorer-architecture-desc">
        <title id="explorer-architecture-title">HWDB Explorer architecture</title>
        <desc id="explorer-architecture-desc">Architecture of the HWDB Explorer: browser pages, the plot workbench and the phone scanner call Django views, which route to domain modules reading a light SQLite mirror for browsing and the FNAL HWDB REST API live for item detail and writes, with FNAL device-flow login minting the bearer and the mirror filled by streamed syncs from HWDB.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== Zones (painted first) ===== -->
        <rect x="40" y="88" width="1200" height="104" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="52" y="92" width="152" height="12" rx="2" fill="#f5f5f5"/>
        <text x="56" y="101" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">BROWSER · DESKTOP, TABLET, PHONE</text>

        <rect x="40" y="232" width="1200" height="232" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="52" y="236" width="236" height="12" rx="2" fill="#f5f5f5"/>
        <text x="56" y="245" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">EXPLORER · DJANGO APP · GUNICORN ON TWISTER</text>

        <rect x="40" y="488" width="1200" height="104" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="52" y="492" width="116" height="12" rx="2" fill="#f5f5f5"/>
        <text x="56" y="501" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">DATA &amp; EXTERNAL SERVICES</text>

        <!-- ===== Arrows (before nodes) ===== -->
        <!-- Pages -> Views -->
        <line x1="280" y1="176" x2="280" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="288" y="214" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="292" y="223" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">HTMX · FORMS</text>
        <!-- Plot workbench -> Views -->
        <line x1="640" y1="176" x2="640" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="648" y="214" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="652" y="223" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">JSON DATA</text>
        <!-- Phone scanner -> Views (async, token-keyed) -->
        <line x1="1000" y1="176" x2="1000" y2="264" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="1008" y="214" width="66" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1012" y="223" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">SCAN TOKEN</text>
        <!-- Views -> Domain modules -->
        <line x1="280" y1="320" x2="280" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Views -> FNAL login -->
        <line x1="640" y1="320" x2="640" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="648" y="350" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="652" y="359" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">MINT BEARER</text>
        <!-- Domain modules -> SQLite mirror -->
        <line x1="280" y1="448" x2="280" y2="520" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="288" y="478" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="292" y="487" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">READ MIRROR</text>
        <!-- Domain modules -> HWDB REST API (live reads and writes) -->
        <path d="M 440,448 V 472 Q 440,480 448,480 H 592 Q 600,480 600,488 V 520" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="496" y="460" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="469" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LIVE API</text>
        <!-- FNAL login -> HWDB REST API (bearer rides on every call) -->
        <line x1="640" y1="448" x2="640" y2="520" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="648" y="478" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="652" y="487" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">BEARER</text>

        <path d="M 760,420 H 992 Q 1000,420 1000,428 V 520" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="844" y="400" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="880" y="409" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DEVICE FLOW</text>
        <!-- HWDB REST API -> SQLite mirror (streamed sync) -->
        <line x1="520" y1="548" x2="400" y2="548" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="442" y="526" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="460" y="535" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SYNC</text>

        <rect x="160" y="120" width="240" height="56" rx="6" fill="#f5f5f5"/>

        <text x="280" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">server-rendered · htmx partials</text>

        <!-- Plot workbench (input) -->
        <rect x="520" y="120" width="240" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="520" y="120" width="240" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="528" y="126" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="542" y="135" fill="rgba(90,101,128,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">JS</text>
        <text x="640" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Plot workbench</text>
        <text x="640" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">plot.js · Draw expressions</text>

        <!-- Phone scanner (input) -->
        <rect x="880" y="120" width="240" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="880" y="120" width="240" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="888" y="126" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="902" y="135" fill="rgba(90,101,128,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PWA</text>
        <text x="1000" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Phone scanner</text>
        <text x="1000" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">QR camera · OCR (tess)</text>

        <!-- Views & URL routes (backend) -->
        <rect x="160" y="264" width="960" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="264" width="960" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="168" y="270" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="182" y="279" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
        <text x="640" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Views &amp; URL routes</text>
        <text x="640" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">views.py · /hw/ = prod · /hw/dev/ = dev · FNAL session login · role-gate banners</text>

        <!-- Domain modules (backend) -->
        <rect x="160" y="392" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="392" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="168" y="398" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="182" y="407" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PY</text>
        <text x="320" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Domain modules</text>
        <text x="320" y="438" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">checklists · ES · shipments · labels · plots · sheets</text>

        <!-- FNAL login (backend) -->
        <rect x="520" y="392" width="240" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="520" y="392" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="528" y="398" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="542" y="407" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
        <text x="640" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">FNAL login</text>
        <text x="640" y="438" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">hwdb/fnal · bearer per request</text>

        <!-- SQLite mirror (focal) -->
        <rect x="160" y="520" width="240" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="520" width="240" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="168" y="526" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>

        <text x="280" y="550" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SQLite mirror</text>
        <text x="280" y="566" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SQLite WAL · types · items · tests</text>

        <!-- HWDB REST API (focal, external) -->

        <!-- FNAL auth (external) -->

  </div>
</body>
</html>
