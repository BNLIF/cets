<script>
// shared checklist behavior (#98) — the fill-out page and the editor's live
// preview both include this once: section fold/unfold, and sections that
// show only while a select field holds a given value.
(function () {
  // #132: values read off a scanned item — {"<PID>|<path>": string|null},
  // fetched once per pair; unknown = the section stays hidden
  var looked = {}, pending = {};
  function lookup(sec, pid, path) {
    var k = pid + "|" + path;
    if (k in looked || pending[k]) return looked[k];
    pending[k] = true;
    fetch(sec.getAttribute("data-when-url").replace("PID", encodeURIComponent(pid)) +
          "?path=" + encodeURIComponent(path))
      .then(function (r) { return r.ok ? r.json() : { value: null }; })
      .catch(function () { return { value: null }; })
      .then(function (d) { looked[k] = d.value == null ? null : String(d.value); delete pending[k]; applyWhen(); });
    return undefined;
  }
  function applyWhen() {
    document.querySelectorAll(".cl-sec[data-when-key]").forEach(function (sec) {
      // the driving select lives among this section's siblings (same form /
      // same preview), never in another checklist on the page
      var path = sec.getAttribute("data-when-path");
      if (path) {
        var inp = sec.parentNode.querySelector('input[name="' + sec.getAttribute("data-when-key") + '"]');
        var pid = inp ? inp.value.trim().toUpperCase() : "";
        var v = pid ? lookup(sec, pid, path) : null;
        sec.querySelector(".cl-when-val").value = v == null ? "" : v;
        sec.hidden = !(v != null && v === sec.getAttribute("data-when-eq"));
        sec.querySelectorAll("[data-req]").forEach(function (i) { i.required = !sec.hidden; });
        return;
      }
      var sel = sec.parentNode.querySelector('select[name="' + sec.getAttribute("data-when-key") + '"]');
      sec.hidden = !(sel && sel.value === sec.getAttribute("data-when-eq"));
      // #131: a required box in a hidden section would silently block submit
      sec.querySelectorAll("[data-req]").forEach(function (i) { i.required = !sec.hidden; });
    });
  }
  window.clApplyWhen = applyWhen;
  document.addEventListener("change", function (e) {
    if (e.target.tagName === "SELECT" && e.target.closest(".cl-sec")) applyWhen();
  });
  var whenT = null;
  document.addEventListener("input", function (e) {   // a PID typed or scanned
    if (e.target.tagName !== "INPUT" || !e.target.name || !e.target.closest(".cl-sec")) return;
    if (!document.querySelector('.cl-sec[data-when-path][data-when-key="' + e.target.name + '"]')) return;
    clearTimeout(whenT); whenT = setTimeout(applyWhen, 350);
  });
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest(".cl-fold");
    if (!b) return;
    var sec = b.closest(".cl-sec");
    sec.classList.toggle("cl-folded");
    b.setAttribute("aria-expanded", sec.classList.contains("cl-folded") ? "false" : "true");
  });
  applyWhen();

  // #109: computed table cells — the JS twin of checklistforms._eval_formula
  // (+ - * / parens, C<n> = the row's 1-based column value; NaN on any
  // problem). The server recomputes authoritatively at submit.
  function evalFormula(expr, get) {
    var tokens = expr.match(/[Cc]\d+|\d+\.?\d*|\.\d+|[()+\-*/]|\S/g) || [];
    var pos = 0;
    function factor() {
      var t = tokens[pos];
      if (t === "-") { pos++; return -factor(); }
      if (t === "(") {
        pos++;
        var v = e();
        if (tokens[pos] !== ")") return NaN;
        pos++; return v;
      }
      pos++;
      if (t === undefined) return NaN;
      if (/^[Cc]/.test(t)) return get(parseInt(t.slice(1), 10) - 1);
      return /^[\d.]/.test(t) ? parseFloat(t) : NaN;
    }
    function term() {
      var v = factor();
      while (tokens[pos] === "*" || tokens[pos] === "/") {
        var op = tokens[pos++]; var r = factor();
        v = op === "*" ? v * r : (r === 0 ? NaN : v / r);
      }
      return v;
    }
    function e() {
      var v = term();
      while (tokens[pos] === "+" || tokens[pos] === "-") {
        var op = tokens[pos++]; v = op === "+" ? v + term() : v - term();
      }
      return v;
    }
    var out = e();
    return pos === tokens.length ? out : NaN;
  }
  function recomputeTable(tbl) {
    tbl.querySelectorAll("input[data-formula]").forEach(function (inp) {
      var row = inp.closest("tr");   // #119: C<n> addresses the cell's OWN row
      var v = evalFormula(inp.getAttribute("data-formula"), function (i) {
        var el = row.querySelector('[data-ci="' + i + '"]');   // an input, or a constant's span (#139)
        var val = el ? (el.value !== undefined ? el.value : el.textContent) : "";
        if (val.trim() === "") return NaN;
        // like the server: a plain number, or the value of "3 +- 1" /
        // "3.1±0.1" / "3 +/- 1"; anything else ("abc", "3 mm") is NaN
        var tol = /^\s*(-?\d+(?:\.\d+)?|-?\.\d+)\s*(?:±|\+-|\+\/-)\s*\d*\.?\d+\s*$/.exec(val);
        return tol ? Number(tol[1]) : Number(val);
      });
      inp.value = isFinite(v) ? String(+v.toFixed(6)) : "";
      // re-fires the tolerance coloring on the computed value
      inp.dispatchEvent(new Event("input", { bubbles: true }));
    });
  }
  document.addEventListener("input", function (e) {
    if (!e.target.matches || !e.target.matches("input[data-ci]")
        || e.target.hasAttribute("data-formula")) return;
    var tbl = e.target.closest("table");
    if (tbl) recomputeTable(tbl);
  });
  window.clRecompute = function () {   // initial pass + editor preview refresh
    document.querySelectorAll(".cl-table input[data-formula]").forEach(function (inp) {
      var tbl = inp.closest("table");
      if (tbl && !tbl.clDone) { tbl.clDone = true; recomputeTable(tbl); }
    });
  };
  window.clRecompute();

  // #113: an image map's dot goes green once its slot holds a value (typing
  // or a scan — the scan modal dispatches an input event on fill). The
  // selector catches the zoomed view's cloned dots too.
  document.addEventListener("input", function (e) {
    var el = e.target;
    if (!el.id || !el.closest || !el.closest(".cl-map-list")) return;
    document.querySelectorAll('.cl-map-dot[data-target="' + el.id + '"]')
      .forEach(function (d) { d.classList.toggle("on", el.value.trim() !== ""); });
  });

  // #133: an imagemap that links sub-components shows the item's positions
  // live and a link/unlink button per scanned slot — one PATCH each, no
  // submit needed (the submit still links whatever is left). A link field
  // (.cl-lnk) is the same thing with one slot (its position) and no table.
  function esc(t) { var d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; }
  function csrf() { var i = document.querySelector('input[name="csrfmiddlewaretoken"]'); return i ? i.value : ""; }
  function mapState(map, d) {
    var fld = map.closest(".cl-field"), state = d.positions || [], just = d.just || "";
    var linked = {};
    state.forEach(function (p) { if (p.part_id) linked[String(p.part_id).toUpperCase()] = p.position; });
    var n = state.filter(function (p) { return p.part_id; }).length;
    var count = fld.querySelector(".cl-map-count"), tbody = fld.querySelector(".cl-map-tbl tbody"), errBox = fld.querySelector(".cl-map-err");
    if (count) count.textContent = n + " of " + state.length + " positions filled";
    // each occupant links to its item page (Chao 2026-09-21); the URL pattern carries this item's PID to swap
    var partUrl = tbody ? tbody.parentNode.getAttribute("data-part-url") || "" : "";
    function partLink(pid) {
      return partUrl ? '<a href="' + esc(partUrl.replace(/\/[A-Z]\d{11}-\d{5}\//, "/" + pid + "/")) + '" target="_blank" rel="noopener">' + esc(pid) + "</a>" : esc(pid);
    }
    if (tbody) tbody.innerHTML = state.length ? state.map(function (p) {
      return "<tr" + (p.part_id && p.part_id === just ? ' class="now"' : "") + "><td>" + esc(p.child_type_name) +
        "</td><td>" + esc(p.position) + "</td>" +
        (p.part_id ? '<td class="mono">' + partLink(p.part_id) + '</td><td><button type="button" class="cl-map-unl" data-pid="' +
                     esc(p.part_id) + '" title="Remove ' + esc(p.part_id) + ' from this item">Unlink</button></td>'
                   : '<td class="empty">— empty</td><td></td>') + "</tr>";
    }).join("") : '<tr><td colspan="4" class="empty">This type defines no positions.</td></tr>';
    fld.querySelectorAll(".cl-map-slot-err").forEach(function (el) { el.remove(); });
    if (d.error && d.slotBtn) {                       // a slot's link failed → under that line
      var msg = document.createElement("div");
      msg.className = "cl-map-slot-err";
      msg.textContent = d.error;
      d.slotBtn.closest(".cl-map-slot, .cl-lnk").insertAdjacentElement("afterend", msg);
    }
    if (errBox) errBox.textContent = d.error && !d.slotBtn ? d.error : "";
    // an assembly list of the sub-assembly in a position: its Link items page is that item's
    var packUrl = map.getAttribute("data-pack-url"), packA = fld.querySelector(".cl-asm-pack"), asmIn = fld.querySelector(".cl-asm-in");
    if (packUrl && packA && d.target) {
      packA.href = packUrl.replace(/\/[A-Z]\d{11}-\d{5}\//, "/" + d.target + "/");
      if (asmIn) asmIn.textContent = "in " + d.target;
    }
    var wants = {}, holds = {};
    state.forEach(function (p) { wants[p.position] = p.child_type_id; holds[p.position] = p.part_id; });
    // an empty slot named like a position shows what already sits there
    fld.querySelectorAll(".cl-map-lnk").forEach(function (b) {
      var inp = document.getElementById(b.getAttribute("data-for")), cur = holds[b.getAttribute("data-slot")];
      if (inp && cur && !inp.value.trim()) {
        inp.value = cur;
        fld.querySelectorAll('.cl-map-dot[data-target="' + inp.id + '"]').forEach(function (d) { d.classList.add("on"); });
        inp.dispatchEvent(new Event("input", { bubbles: true }));   // a when-rule on a link field follows
      }
    });
    // pick lists: a slot named like a position lists that position's type,
    // any other slot every type a free position accepts (all types when none is free)
    var names = {}, freeT = [], allT = [];
    state.forEach(function (p) {
      names[p.child_type_id] = p.child_type_name;
      if (allT.indexOf(p.child_type_id) < 0) allT.push(p.child_type_id);
      if (!p.part_id && freeT.indexOf(p.child_type_id) < 0) freeT.push(p.child_type_id);
    });
    fld.querySelectorAll(".cl-pick[data-slot]").forEach(function (b) {
      var w = wants[b.getAttribute("data-slot")], t = w ? [w] : freeT.length ? freeT : allT;
      b.hidden = !t.length;
      b.setAttribute("data-type-id", t.join(","));
      b.setAttribute("data-type-names", JSON.stringify(t.map(function (x) { return names[x] || x; })));
    });
    fld.querySelectorAll(".cl-map-lnk").forEach(function (b) {
      var inp = document.getElementById(b.getAttribute("data-for"));
      var pid = inp ? inp.value.trim().toUpperCase() : "";
      b.hidden = !pid;
      if (!pid) return;
      var on = pid in linked, slot = b.getAttribute("data-slot"), ctid = pid.split("-")[0];
      // a slot named like a position must get that position's type
      var wrong = !on && wants[slot] && wants[slot] !== ctid;
      b.classList.toggle("on", on);
      b.disabled = !!wrong;
      b.textContent = on ? "unlink" : "link";
      b.title = on ? "in " + linked[pid] : wrong ? slot + " expects " + wants[slot] + " items" : "link into this item now";
      var note = fld.querySelector('.cl-lnk-in[data-for="' + b.getAttribute("data-for") + '"]');
      if (note) note.textContent = on ? "in " + linked[pid] : "";
    });
    map._state = d;
  }
  // #153: a linking table's "link now" — every PID in its cells goes to the
  // item's sub-components (or the sub-assembly in data-into) in one PATCH
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest(".cl-tbl-lnk");
    if (!b) return;
    var bar = b.closest(".cl-tbl-link"), tbl = bar.previousElementSibling, st = bar.querySelector(".cl-tbl-status");
    var cells = Array.prototype.slice.call(tbl.querySelectorAll("input.cl-pidcell"));
    var pids = cells.map(function (i) { return i.value.trim().toUpperCase(); })
                    .filter(function (v, i, a) { return v && /^[A-Z]\d{11}-\d{5}$/.test(v) && a.indexOf(v) === i; });
    if (!pids.length) { st.textContent = "nothing to link — cells need PIDs"; return; }
    var fd = new FormData();
    fd.append("action", "link_table"); fd.append("into", bar.dataset.into || "");
    pids.forEach(function (p) { fd.append("pid", p); });
    b.disabled = true; st.textContent = "linking " + pids.length + "…";
    fetch(bar.dataset.linkUrl, { method: "POST", body: fd, credentials: "same-origin", headers: { "X-CSRFToken": csrf() } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var linked = d.linked || [];
        cells.forEach(function (i) { i.classList.toggle("cl-linked", linked.indexOf(i.value.trim().toUpperCase()) >= 0); });
        st.textContent = (linked.length ? linked.length + " of " + pids.length + " linked" + (d.target ? " in " + d.target : "") : "")
                       + (d.error ? (linked.length ? " · " : "") + d.error : "");
        st.classList.toggle("cl-bad-text", !!d.error);
        refreshLinkers();   // the assembly / imagemap lists follow
      })
      .catch(function () { st.textContent = "couldn’t reach the server"; })
      .then(function () { b.disabled = false; });
  });

  // #153: "check" — link now as a dry run; each filled cell is told the
  // position it would take (or what stops it, as its tooltip, painted red)
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest(".cl-tbl-chk");
    if (!b) return;
    var bar = b.closest(".cl-tbl-link"), tbl = bar.previousElementSibling, st = bar.querySelector(".cl-tbl-status");
    var cells = Array.prototype.slice.call(tbl.querySelectorAll("input.cl-pidcell")).filter(function (i) { return i.value.trim(); });
    if (!cells.length) { st.textContent = "nothing to check — the cells are empty"; return; }
    var fd = new FormData();
    fd.append("action", "check_table"); fd.append("into", bar.dataset.into || ""); fd.append("type_id", bar.dataset.typeId || "");
    cells.forEach(function (i) { fd.append("cell", i.value.trim()); });
    b.disabled = true; st.textContent = "checking " + cells.length + "…";
    fetch(bar.dataset.linkUrl, { method: "POST", body: fd, credentials: "same-origin", headers: { "X-CSRFToken": csrf() } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var res = d.results || [], bad = [], ok = 0;
        cells.forEach(function (i, k) {
          var r = res[k];
          if (!r) return;
          i.classList.toggle("cl-bad", !r.ok);
          if (!r.ok) i.classList.remove("cl-ok");
          i.classList.toggle("cl-linked", r.note === "already linked");
          i.title = r.note || "";
          if (r.ok) ok++; else bad.push(i.value.trim() + " — " + r.note);
        });
        st.textContent = d.error ? d.error
          : ok + " of " + cells.length + " can be linked" + (d.target ? " in " + d.target : "") + (bad.length ? " · " + bad.join(" · ") : "");
        st.classList.toggle("cl-bad-text", !!(d.error || bad.length));
      })
      .catch(function () { st.textContent = "couldn’t reach the server"; })
      .then(function () { b.disabled = false; });
  });

  var LINKERS = ".cl-map[data-link-url], .cl-lnk[data-link-url], .cl-asm[data-link-url]";
  function mapCall(map, body) {
    var opts = { credentials: "same-origin" };
    if (body) { opts.method = "POST"; opts.body = body; opts.headers = { "X-CSRFToken": csrf() }; }
    return fetch(map.getAttribute("data-link-url"), opts)
      .then(function (r) { return r.json(); })
      .catch(function () { return { positions: (map._state || {}).positions || [], error: "HWDB not reachable" }; })
      .then(function (d) {
        mapState(map, d);
        // every other linker reading the same URL shows the same item — keep them in step (no error carried over)
        var url = map.getAttribute("data-link-url");
        document.querySelectorAll(LINKERS).forEach(function (o) { if (o !== map && o.getAttribute("data-link-url") === url) mapState(o, { positions: d.positions, target: d.target }); });
      });
  }
  function refreshLinkers() {   // one GET for every list on the page (the item, the sub-assemblies in positions)
    var byUrl = {}, order = [];
    document.querySelectorAll(LINKERS).forEach(function (m) { var u = m.getAttribute("data-link-url"); if (!byUrl[u]) { byUrl[u] = []; order.push(u); } byUrl[u].push(m); });
    if (order.length <= 1) { if (order.length) mapCall(byUrl[order[0]][0]); return; }
    var base = order[0].split("?")[0], intoOf = {};
    order.forEach(function (u) { var q = u.split("?")[1] || "", m = /(?:^|&)into=([^&]*)/.exec(q); intoOf[u] = m ? decodeURIComponent(m[1]) : ""; });
    fetch(base + "?" + order.map(function (u) { return "into=" + encodeURIComponent(intoOf[u]); }).join("&"), { credentials: "same-origin" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var lists = {};
        (d.lists || []).forEach(function (l) { lists[l.into] = l; });
        order.forEach(function (u) {
          var l = lists[intoOf[u]] || { positions: [], error: d.error || "HWDB not reachable" };
          byUrl[u].forEach(function (m) { mapState(m, { positions: l.positions, target: l.target, error: l.error }); });
        });
      })
      .catch(function () { order.forEach(function (u) { byUrl[u].forEach(function (m) { mapState(m, { positions: [], error: "HWDB not reachable" }); }); }); });
  }
  refreshLinkers();
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest(".cl-map-lnk, .cl-map-unl");
    if (!b) return;
    var map = b.closest(".cl-field").querySelector(LINKERS);
    var fd = new FormData(), pid;
    if (b.classList.contains("cl-map-unl")) {
      pid = b.getAttribute("data-pid");
      fd.append("action", "unlink");
    } else {
      var inp = document.getElementById(b.getAttribute("data-for"));
      pid = inp ? inp.value.trim().toUpperCase() : "";
      fd.append("action", b.classList.contains("on") ? "unlink" : "link");
      fd.append("slot", b.getAttribute("data-slot"));
    }
    fd.append("pid", pid);
    b.disabled = true;
    mapCall(map, fd).then(function () {
      b.disabled = false;
      if (map._state) {
        map._state.just = pid;
        map._state.slotBtn = b.classList.contains("cl-map-lnk") ? b : null;
        mapState(map, map._state);
      }
    });
  });
  document.addEventListener("input", function (e) {   // typed/scanned → button follows
    var el = e.target;
    if (!el.closest || !el.closest(".cl-map-list, .cl-lnk")) return;
    var map = el.closest(".cl-field").querySelector(LINKERS);
    if (map && map._state) { map._state.error = null; mapState(map, map._state); }   // editing clears a stale error
  });

  // #113: tap the map drawing → zoomed view at full resolution with the
  // slot circles; the cloned dots keep cl-scan + data-target, so tapping
  // one there opens the scanner on top (where the scan modal is included)
  var mapDlg = null;
  document.addEventListener("click", function (e) {
    var im = e.target.closest && e.target.closest(".cl-map > img");
    if (!im) return;
    if (!mapDlg) {
      mapDlg = document.createElement("dialog");
      mapDlg.className = "cl-mapzoom";
      mapDlg.innerHTML = '<div class="cl-mz-bar"><button type="button" class="cl-mz-x es-btn quiet">✕</button></div>'
        + '<div class="cl-mz-scroll"><div class="cl-mz-wrap"></div></div>';
      document.body.appendChild(mapDlg);
      mapDlg.addEventListener("click", function (ev) {
        if (ev.target === mapDlg || ev.target.classList.contains("cl-mz-x")) mapDlg.close();
      });
    }
    var wrap = mapDlg.querySelector(".cl-mz-wrap");
    wrap.innerHTML = "";
    var big = document.createElement("img");
    big.src = im.src;
    wrap.appendChild(big);
    im.closest(".cl-map").querySelectorAll(".cl-map-dot").forEach(function (d) {
      wrap.appendChild(d.cloneNode(true));
    });
    mapDlg.showModal();
  });

  // #107: an inline reference that isn't a browser-renderable image (a PDF
  // drawing) shows as a broken <img> — swap it for a view button that opens
  // the lightbox (_lightbox.html) instead
  document.addEventListener("error", function (e) {
    var im = e.target;
    if (!im.classList || !im.classList.contains("cl-static-img")) return;
    var b = document.createElement("button");
    b.type = "button";
    b.className = "cl-lb-pdfbtn";
    b.setAttribute("data-lightbox", "");
    b.setAttribute("data-lb-src", im.getAttribute("data-lb-src") || im.src);
    b.textContent = "📄 view drawing";
    im.replaceWith(b);
  }, true);
})();
</script>

<script>
// #160: plot fields — a Plots page embedded with the PIDs / serial numbers
// of its type found in the form (the whole form, or the field's sections).
// The frame's URL hash carries the entries; a hash-only change is a
// same-document navigation, so the page re-reads it without reloading.
(function () {
  var PID = /^[A-Za-z]\d{11}-\d{5}$/, SKIP = { checkbox: 1, radio: 1, file: 1, hidden: 1, button: 1, submit: 1, "datetime-local": 1 };
  function namesOf(p, suffix) {   // the field's sections / fields lists (json_script)
    var el = p.querySelector("script[id$='" + suffix + "']"), a = [];
    try { a = JSON.parse(el ? el.textContent : "[]"); } catch (e) {}
    return Array.isArray(a) ? a : [];
  }
  function entries(p) {
    var type = p.getAttribute("data-type"), secs = namesOf(p, "-secs"), flds = namesOf(p, "-flds"), re = null, sn = p.getAttribute("data-sn");
    if (sn) { try { re = new RegExp("^(?:" + sn + ")$", "i"); } catch (e) {} }
    // the checklist's own sections only — not the Item card, not the page's controls
    var all = Array.prototype.slice.call(document.querySelectorAll(".cl-sec[data-title]"));
    var roots = all.filter(function (s) { return !secs.length || secs.indexOf(s.getAttribute("data-title")) >= 0; });
    // a name the form doesn't have is said so under the empty box (Anselmo 2026-09-21:
    // a section title spelt differently — the plot stayed empty without a word)
    var have = all.map(function (s) { return s.getAttribute("data-title"); });
    p._missing = secs.filter(function (t) { return have.indexOf(t) < 0; }).map(function (t) { return "no section named “" + t + "” in this form"; });
    // named fields only (a table among three in one section), when the field says so
    if (flds.length) {
      var picked = [], labels = [];
      roots.forEach(function (r) { Array.prototype.forEach.call(r.querySelectorAll(".cl-field[data-label]"), function (f) { labels.push(f.getAttribute("data-label")); if (flds.indexOf(f.getAttribute("data-label")) >= 0) picked.push(f); }); });
      if (!p._missing.length) flds.forEach(function (l) { if (labels.indexOf(l) < 0) p._missing.push("no field named “" + l + "”" + (secs.length ? " in " + secs.join(", ") : " in this form")); });
      roots = picked;
    }
    var out = [], seen = {};
    roots.forEach(function (r) {
      Array.prototype.forEach.call(r.querySelectorAll("input, textarea"), function (el) {
        if (SKIP[(el.type || "").toLowerCase()] || el.closest(".cl-plot-box")) return;
        var v = (el.value || "").trim();
        if (!v) return;
        if (PID.test(v)) { v = v.toUpperCase(); if (v.indexOf(type + "-") !== 0) return; }
        else if (re ? !re.test(v) : (/\s/.test(v) || v.length > 32)) return;   // no pattern: any single token
        if (!seen[v]) { seen[v] = 1; out.push(v); }
      });
    });
    return out;
  }
  function update(p) {
    if (p.hasAttribute("data-ref")) return;   // a reference plot: as pasted, nothing collected
    var ids = entries(p), frame = p.querySelector("iframe"), empty = p.querySelector(".cl-plot-empty"), open = p.querySelector(".cl-plot-open");
    var cfg = {};
    try { cfg = JSON.parse(decodeURIComponent(p.getAttribute("data-hash") || "") || "{}"); } catch (e) {}
    if (!cfg || typeof cfg !== "object") cfg = {};
    cfg.ids = ids; delete cfg.sp;
    var hash = "#" + encodeURIComponent(JSON.stringify(cfg)), base = p.getAttribute("data-plot");
    open.href = base + hash; open.hidden = !ids.length;
    frame.hidden = !ids.length; empty.hidden = !!ids.length;
    if (!ids.length) {
      if (!empty._text) empty._text = empty.textContent;
      empty.textContent = (p._missing || []).length ? p._missing.join(" · ") + " — check the plot field’s sections and fields." : empty._text;
      empty.classList.toggle("cl-bad-text", !!(p._missing || []).length);
      return;
    }
    var src = base + "?embed=1" + hash;
    if (frame.getAttribute("src") === src) return;
    // a loaded frame takes the new entries through its hash — same document,
    // the page re-reads it; before that (or cross-origin), the URL is set
    try {
      var w = frame.contentWindow;
      if (frame.getAttribute("src") && w && w.location.pathname === new URL(base, location.href).pathname) {
        frame.setAttribute("src", src); w.location.hash = hash; return;
      }
    } catch (e) {}
    frame.src = src;
  }
  window.clPlots = function () { Array.prototype.forEach.call(document.querySelectorAll(".cl-plot-box"), update); };

  // #176: sum fields — one sweep of the type's specifications per field (the
  // Plots page's NDJSON stream), adding the key's value from the latest
  // specifications DATA of every item (any section holding the key), in the
  // named statuses when given. Read once when the form opens.
  Array.prototype.forEach.call(document.querySelectorAll(".cl-sum-box"), function (box) {
    var key = box.dataset.sumKey, want = (box.dataset.sumStatus || "").split("|").filter(Boolean).map(function (x) { return x.toLowerCase(); });
    var tot = box.querySelector(".cl-sum-total"), note = box.querySelector(".cl-sum-note");
    function fail(msg) { tot.textContent = "—"; note.textContent = msg; box.classList.add("err"); }
    if (!box.dataset.sumUrl) return fail("the total shows on the form");   // the editor's preview
    if (!navigator.onLine) return fail("offline — the total needs the connection");
    var tokenInput = document.querySelector('input[name="csrfmiddlewaretoken"]');   // csrf() lives in the first script block
    fetch(box.dataset.sumUrl, { method: "POST", credentials: "same-origin", headers: { "X-CSRFToken": tokenInput ? tokenInput.value : "" } })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (text) {
        var sum = 0, n = 0, seen = 0, latest = "", err = "";
        text.split("\n").forEach(function (line) {
          if (!line.trim()) return;
          var row; try { row = JSON.parse(line); } catch (e) { return; }
          if (row.error) { err = row.error; return; }
          if (!row.pid) return;
          seen++;
          if (want.length && want.indexOf(String(row.status || "").toLowerCase()) < 0) return;
          var d = row.data || {}, v = null;
          Object.keys(d).forEach(function (sec) {
            var s = d[sec];
            if (v === null && s && typeof s === "object" && key in s) v = s[key];
          });
          if (v === null && key in d) v = d[key];
          var num = typeof v === "number" ? v : parseFloat(String(v === null || v === undefined ? "" : v).replace(/,/g, ""));
          if (isNaN(num)) return;
          sum += num; n++;
          if (row.pid > latest) latest = row.pid;
        });
        if (err) return fail(err);
        tot.textContent = Number.isInteger(sum) ? sum.toLocaleString() : sum.toLocaleString(undefined, { maximumFractionDigits: 3 });
        note.textContent = "over " + n + " of " + seen + " item" + (seen === 1 ? "" : "s") + (want.length ? " in " + (box.dataset.sumStatus || "").split("|").join(" / ") : "") + (latest ? " · latest " + latest : "");
        box.classList.remove("err");
      })
      .catch(function (e) { fail("couldn’t read the type’s items — " + e.message); });
  });
  var timer = null;
  function schedule() { clearTimeout(timer); timer = setTimeout(window.clPlots, 800); }
  document.addEventListener("input", schedule);
  document.addEventListener("change", schedule);
  window.clPlots();
})();
</script>
