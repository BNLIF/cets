<script>
// shared checklist behavior (#98) — the fill-out page and the editor's live
// preview both include this once: section fold/unfold, and sections that
// show only while a select field holds a given value.
(function () {
  // #132: values read off a scanned item — {"<PID>|<path>": string|null},
  // fetched once per pair; unknown = the section stays hidden
  var looked = {}, pending = {};
  function lookup(sec, pid, path) {
    var k = pid + "|" + path;
    if (k in looked || pending[k]) return looked[k];
    pending[k] = true;
    fetch(sec.getAttribute("data-when-url").replace("PID", encodeURIComponent(pid)) +
          "?path=" + encodeURIComponent(path))
      .then(function (r) { return r.ok ? r.json() : { value: null }; })
      .catch(function () { return { value: null }; })
      .then(function (d) { looked[k] = d.value == null ? null : String(d.value); delete pending[k]; applyWhen(); });
    return undefined;
  }
  function applyWhen() {
    document.querySelectorAll(".cl-sec[data-when-key]").forEach(function (sec) {
      // the driving select lives among this section's siblings (same form /
      // same preview), never in another checklist on the page
      var path = sec.getAttribute("data-when-path");
      if (path) {
        var inp = sec.parentNode.querySelector('input[name="' + sec.getAttribute("data-when-key") + '"]');
        var pid = inp ? inp.value.trim().toUpperCase() : "";
        var v = pid ? lookup(sec, pid, path) : null;
        sec.querySelector(".cl-when-val").value = v == null ? "" : v;
        sec.hidden = !(v != null && v === sec.getAttribute("data-when-eq"));
        sec.querySelectorAll("[data-req]").forEach(function (i) { i.required = !sec.hidden; });
        return;
      }
      var sel = sec.parentNode.querySelector('select[name="' + sec.getAttribute("data-when-key") + '"]');
      sec.hidden = !(sel && sel.value === sec.getAttribute("data-when-eq"));
      // #131: a required box in a hidden section would silently block submit
      sec.querySelectorAll("[data-req]").forEach(function (i) { i.required = !sec.hidden; });
    });
  }
  window.clApplyWhen = applyWhen;
  document.addEventListener("change", function (e) {
    if (e.target.tagName === "SELECT" && e.target.closest(".cl-sec")) applyWhen();
  });
  var whenT = null;
  document.addEventListener("input", function (e) {   // a PID typed or scanned
    if (e.target.tagName !== "INPUT" || !e.target.name || !e.target.closest(".cl-sec")) return;
    if (!document.querySelector('.cl-sec[data-when-path][data-when-key="' + e.target.name + '"]')) return;
    clearTimeout(whenT); whenT = setTimeout(applyWhen, 350);
  });
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest(".cl-fold");
    if (!b) return;
    var sec = b.closest(".cl-sec");
    sec.classList.toggle("cl-folded");
    b.setAttribute("aria-expanded", sec.classList.contains("cl-folded") ? "false" : "true");
  });
  applyWhen();

  // #109: computed table cells — the JS twin of checklistforms._eval_formula
  // (+ - * / parens, C<n> = the row's 1-based column value; NaN on any
  // problem). The server recomputes authoritatively at submit.
  function evalFormula(expr, get) {
    var tokens = expr.match(/[Cc]\d+|\d+\.?\d*|\.\d+|[()+\-*/]|\S/g) || [];
    var pos = 0;
    function factor() {
      var t = tokens[pos];
      if (t === "-") { pos++; return -factor(); }
      if (t === "(") {
        pos++;
        var v = e();
        if (tokens[pos] !== ")") return NaN;
        pos++; return v;
      }
      pos++;
      if (t === undefined) return NaN;
      if (/^[Cc]/.test(t)) return get(parseInt(t.slice(1), 10) - 1);
      return /^[\d.]/.test(t) ? parseFloat(t) : NaN;
    }
    function term() {
      var v = factor();
      while (tokens[pos] === "*" || tokens[pos] === "/") {
        var op = tokens[pos++]; var r = factor();
        v = op === "*" ? v * r : (r === 0 ? NaN : v / r);
      }
      return v;
    }
    function e() {
      var v = term();
      while (tokens[pos] === "+" || tokens[pos] === "-") {
        var op = tokens[pos++]; v = op === "+" ? v + term() : v - term();
      }
      return v;
    }
    var out = e();
    return pos === tokens.length ? out : NaN;
  }
  function recomputeTable(tbl) {
    tbl.querySelectorAll("input[data-formula]").forEach(function (inp) {
      var row = inp.closest("tr");   // #119: C<n> addresses the cell's OWN row
      var v = evalFormula(inp.getAttribute("data-formula"), function (i) {
        var el = row.querySelector('input[data-ci="' + i + '"]');
        if (!el || el.value.trim() === "") return NaN;
        // like the server: a plain number, or the value of "3 +- 1" /
        // "3.1±0.1" / "3 +/- 1"; anything else ("abc", "3 mm") is NaN
        var tol = /^\s*(-?\d+(?:\.\d+)?|-?\.\d+)\s*(?:±|\+-|\+\/-)\s*\d*\.?\d+\s*$/.exec(el.value);
        return tol ? Number(tol[1]) : Number(el.value);
      });
      inp.value = isFinite(v) ? String(+v.toFixed(6)) : "";
      // re-fires the tolerance coloring on the computed value
      inp.dispatchEvent(new Event("input", { bubbles: true }));
    });
  }
  document.addEventListener("input", function (e) {
    if (!e.target.matches || !e.target.matches("input[data-ci]")
        || e.target.hasAttribute("data-formula")) return;
    var tbl = e.target.closest("table");
    if (tbl) recomputeTable(tbl);
  });
  window.clRecompute = function () {   // initial pass + editor preview refresh
    document.querySelectorAll(".cl-table input[data-formula]").forEach(function (inp) {
      var tbl = inp.closest("table");
      if (tbl && !tbl.clDone) { tbl.clDone = true; recomputeTable(tbl); }
    });
  };
  window.clRecompute();

  // #113: an image map's dot goes green once its slot holds a value (typing
  // or a scan — the scan modal dispatches an input event on fill). The
  // selector catches the zoomed view's cloned dots too.
  document.addEventListener("input", function (e) {
    var el = e.target;
    if (!el.id || !el.closest || !el.closest(".cl-map-list")) return;
    document.querySelectorAll('.cl-map-dot[data-target="' + el.id + '"]')
      .forEach(function (d) { d.classList.toggle("on", el.value.trim() !== ""); });
  });

  // #133: an imagemap that links sub-components shows the item's positions
  // live and a link/unlink button per scanned slot — one PATCH each, no
  // submit needed (the submit still links whatever is left)
  function esc(t) { var d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; }
  function csrf() { var i = document.querySelector('input[name="csrfmiddlewaretoken"]'); return i ? i.value : ""; }
  function mapState(map, d) {
    var fld = map.closest(".cl-field"), state = d.positions || [], just = d.just || "";
    var linked = {};
    state.forEach(function (p) { if (p.part_id) linked[String(p.part_id).toUpperCase()] = p.position; });
    var n = state.filter(function (p) { return p.part_id; }).length;
    fld.querySelector(".cl-map-count").textContent = n + " of " + state.length + " positions filled";
    fld.querySelector(".cl-map-tbl tbody").innerHTML = state.length ? state.map(function (p) {
      return "<tr" + (p.part_id && p.part_id === just ? ' class="now"' : "") + "><td>" + esc(p.child_type_name) +
        "</td><td>" + esc(p.position) + "</td>" +
        (p.part_id ? '<td class="mono">' + esc(p.part_id) + '</td><td><button type="button" class="cl-map-unl" data-pid="' +
                     esc(p.part_id) + '" title="Remove ' + esc(p.part_id) + ' from this item">Unlink</button></td>'
                   : '<td class="empty">— empty</td><td></td>') + "</tr>";
    }).join("") : '<tr><td colspan="4" class="empty">This type defines no positions.</td></tr>';
    fld.querySelectorAll(".cl-map-slot-err").forEach(function (el) { el.remove(); });
    if (d.error && d.slotBtn) {                       // a slot's link failed → under that line
      var msg = document.createElement("div");
      msg.className = "cl-map-slot-err";
      msg.textContent = d.error;
      d.slotBtn.closest(".cl-map-slot").insertAdjacentElement("afterend", msg);
    }
    fld.querySelector(".cl-map-err").textContent = d.error && !d.slotBtn ? d.error : "";
    var wants = {}, holds = {};
    state.forEach(function (p) { wants[p.position] = p.child_type_id; holds[p.position] = p.part_id; });
    // an empty slot named like a position shows what already sits there
    fld.querySelectorAll(".cl-map-lnk").forEach(function (b) {
      var inp = document.getElementById(b.getAttribute("data-for")), cur = holds[b.getAttribute("data-slot")];
      if (inp && cur && !inp.value.trim()) {
        inp.value = cur;
        fld.querySelectorAll('.cl-map-dot[data-target="' + inp.id + '"]').forEach(function (d) { d.classList.add("on"); });
      }
    });
    // pick lists: a slot named like a position lists that position's type,
    // any other slot every type a free position accepts (all types when none is free)
    var names = {}, freeT = [], allT = [];
    state.forEach(function (p) {
      names[p.child_type_id] = p.child_type_name;
      if (allT.indexOf(p.child_type_id) < 0) allT.push(p.child_type_id);
      if (!p.part_id && freeT.indexOf(p.child_type_id) < 0) freeT.push(p.child_type_id);
    });
    fld.querySelectorAll(".cl-pick[data-slot]").forEach(function (b) {
      var w = wants[b.getAttribute("data-slot")], t = w ? [w] : freeT.length ? freeT : allT;
      b.hidden = !t.length;
      b.setAttribute("data-type-id", t.join(","));
      b.setAttribute("data-type-names", JSON.stringify(t.map(function (x) { return names[x] || x; })));
    });
    fld.querySelectorAll(".cl-map-lnk").forEach(function (b) {
      var inp = document.getElementById(b.getAttribute("data-for"));
      var pid = inp ? inp.value.trim().toUpperCase() : "";
      b.hidden = !pid;
      if (!pid) return;
      var on = pid in linked, slot = b.getAttribute("data-slot"), ctid = pid.split("-")[0];
      // a slot named like a position must get that position's type
      var wrong = !on && wants[slot] && wants[slot] !== ctid;
      b.classList.toggle("on", on);
      b.disabled = !!wrong;
      b.textContent = on ? "unlink" : "link";
      b.title = on ? "in " + linked[pid] : wrong ? slot + " expects " + wants[slot] + " items" : "link into this item now";
    });
    map._state = d;
  }
  function mapCall(map, body) {
    var opts = { credentials: "same-origin" };
    if (body) { opts.method = "POST"; opts.body = body; opts.headers = { "X-CSRFToken": csrf() }; }
    return fetch(map.getAttribute("data-link-url"), opts)
      .then(function (r) { return r.json(); })
      .catch(function () { return { positions: (map._state || {}).positions || [], error: "HWDB not reachable" }; })
      .then(function (d) { mapState(map, d); });
  }
  document.querySelectorAll(".cl-map[data-link-url]").forEach(function (m) { mapCall(m); });
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest(".cl-map-lnk, .cl-map-unl");
    if (!b) return;
    var map = b.closest(".cl-field").querySelector(".cl-map[data-link-url]");
    var fd = new FormData(), pid;
    if (b.classList.contains("cl-map-unl")) {
      pid = b.getAttribute("data-pid");
      fd.append("action", "unlink");
    } else {
      var inp = document.getElementById(b.getAttribute("data-for"));
      pid = inp ? inp.value.trim().toUpperCase() : "";
      fd.append("action", b.classList.contains("on") ? "unlink" : "link");
      fd.append("slot", b.getAttribute("data-slot"));
    }
    fd.append("pid", pid);
    b.disabled = true;
    mapCall(map, fd).then(function () {
      b.disabled = false;
      if (map._state) {
        map._state.just = pid;
        map._state.slotBtn = b.classList.contains("cl-map-lnk") ? b : null;
        mapState(map, map._state);
      }
    });
  });
  document.addEventListener("input", function (e) {   // typed/scanned → button follows
    var el = e.target;
    if (!el.closest || !el.closest(".cl-map-list")) return;
    var map = el.closest(".cl-field").querySelector(".cl-map[data-link-url]");
    if (map && map._state) { map._state.error = null; mapState(map, map._state); }   // editing clears a stale error
  });

  // #113: tap the map drawing → zoomed view at full resolution with the
  // slot circles; the cloned dots keep cl-scan + data-target, so tapping
  // one there opens the scanner on top (where the scan modal is included)
  var mapDlg = null;
  document.addEventListener("click", function (e) {
    var im = e.target.closest && e.target.closest(".cl-map > img");
    if (!im) return;
    if (!mapDlg) {
      mapDlg = document.createElement("dialog");
      mapDlg.className = "cl-mapzoom";
      mapDlg.innerHTML = '<div class="cl-mz-bar"><button type="button" class="cl-mz-x es-btn quiet">✕</button></div>'
        + '<div class="cl-mz-scroll"><div class="cl-mz-wrap"></div></div>';
      document.body.appendChild(mapDlg);
      mapDlg.addEventListener("click", function (ev) {
        if (ev.target === mapDlg || ev.target.classList.contains("cl-mz-x")) mapDlg.close();
      });
    }
    var wrap = mapDlg.querySelector(".cl-mz-wrap");
    wrap.innerHTML = "";
    var big = document.createElement("img");
    big.src = im.src;
    wrap.appendChild(big);
    im.closest(".cl-map").querySelectorAll(".cl-map-dot").forEach(function (d) {
      wrap.appendChild(d.cloneNode(true));
    });
    mapDlg.showModal();
  });

  // #107: an inline reference that isn't a browser-renderable image (a PDF
  // drawing) shows as a broken <img> — swap it for a view button that opens
  // the lightbox (_lightbox.html) instead
  document.addEventListener("error", function (e) {
    var im = e.target;
    if (!im.classList || !im.classList.contains("cl-static-img")) return;
    var b = document.createElement("button");
    b.type = "button";
    b.className = "cl-lb-pdfbtn";
    b.setAttribute("data-lightbox", "");
    b.setAttribute("data-lb-src", im.getAttribute("data-lb-src") || im.src);
    b.textContent = "📄 view drawing";
    im.replaceWith(b);
  }, true);
})();
</script>
