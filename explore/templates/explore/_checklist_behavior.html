<script>
// shared checklist behavior (#98) — the fill-out page and the editor's live
// preview both include this once: section fold/unfold, and sections that
// show only while a select field holds a given value.
(function () {
  function applyWhen() {
    document.querySelectorAll(".cl-sec[data-when-key]").forEach(function (sec) {
      // the driving select lives among this section's siblings (same form /
      // same preview), never in another checklist on the page
      var sel = sec.parentNode.querySelector('select[name="' + sec.getAttribute("data-when-key") + '"]');
      sec.hidden = !(sel && sel.value === sec.getAttribute("data-when-eq"));
    });
  }
  window.clApplyWhen = applyWhen;
  document.addEventListener("change", function (e) {
    if (e.target.tagName === "SELECT" && e.target.closest(".cl-sec")) applyWhen();
  });
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest(".cl-fold");
    if (!b) return;
    var sec = b.closest(".cl-sec");
    sec.classList.toggle("cl-folded");
    b.setAttribute("aria-expanded", sec.classList.contains("cl-folded") ? "false" : "true");
  });
  applyWhen();

  // #109: computed table cells — the JS twin of checklistforms._eval_formula
  // (+ - * / parens, C<n> = the row's 1-based column value; NaN on any
  // problem). The server recomputes authoritatively at submit.
  function evalFormula(expr, get) {
    var tokens = expr.match(/[Cc]\d+|\d+\.?\d*|\.\d+|[()+\-*/]|\S/g) || [];
    var pos = 0;
    function factor() {
      var t = tokens[pos];
      if (t === "-") { pos++; return -factor(); }
      if (t === "(") {
        pos++;
        var v = e();
        if (tokens[pos] !== ")") return NaN;
        pos++; return v;
      }
      pos++;
      if (t === undefined) return NaN;
      if (/^[Cc]/.test(t)) return get(parseInt(t.slice(1), 10) - 1);
      return /^[\d.]/.test(t) ? parseFloat(t) : NaN;
    }
    function term() {
      var v = factor();
      while (tokens[pos] === "*" || tokens[pos] === "/") {
        var op = tokens[pos++]; var r = factor();
        v = op === "*" ? v * r : (r === 0 ? NaN : v / r);
      }
      return v;
    }
    function e() {
      var v = term();
      while (tokens[pos] === "+" || tokens[pos] === "-") {
        var op = tokens[pos++]; v = op === "+" ? v + term() : v - term();
      }
      return v;
    }
    var out = e();
    return pos === tokens.length ? out : NaN;
  }
  function recomputeTable(tbl) {
    tbl.querySelectorAll("input[data-formula]").forEach(function (inp) {
      var v = evalFormula(inp.getAttribute("data-formula"), function (i) {
        var el = tbl.querySelector('input[data-ci="' + i + '"]');
        return el ? parseFloat(el.value) : NaN;
      });
      inp.value = isFinite(v) ? String(+v.toFixed(6)) : "";
      // re-fires the tolerance coloring on the computed value
      inp.dispatchEvent(new Event("input", { bubbles: true }));
    });
  }
  document.addEventListener("input", function (e) {
    if (!e.target.matches || !e.target.matches("input[data-ci]")
        || e.target.hasAttribute("data-formula")) return;
    var tbl = e.target.closest("table");
    if (tbl) recomputeTable(tbl);
  });
  window.clRecompute = function () {   // initial pass + editor preview refresh
    document.querySelectorAll(".cl-table input[data-formula]").forEach(function (inp) {
      var tbl = inp.closest("table");
      if (tbl && !tbl.clDone) { tbl.clDone = true; recomputeTable(tbl); }
    });
  };
  window.clRecompute();

  // #107: an inline reference that isn't a browser-renderable image (a PDF
  // drawing) shows as a broken <img> — swap it for a view button that opens
  // the lightbox (_lightbox.html) instead
  document.addEventListener("error", function (e) {
    var im = e.target;
    if (!im.classList || !im.classList.contains("cl-static-img")) return;
    var b = document.createElement("button");
    b.type = "button";
    b.className = "cl-lb-pdfbtn";
    b.setAttribute("data-lightbox", "");
    b.setAttribute("data-lb-src", im.src);
    b.textContent = "📄 view drawing";
    im.replaceWith(b);
  }, true);
})();
</script>
