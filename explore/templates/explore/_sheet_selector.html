{# All shipping sheets ever uploaded (append-only, one per run), newest first (#77). #}
<div style="display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; margin: 8px 0 2px;">
  <label style="font-size:12px; color:var(--faint); display:flex; flex-direction:column; gap:3px;">
    Shipping sheets ({{ shipping_sheets|length }})
    <select id="pd-sheets" title="{{ shipping_sheets.0.image_name }}" style="font:inherit; font-size:13px; color:var(--ink); background:var(--surface);
            border:1px solid var(--rule); border-radius:var(--r-sm); padding:6px 8px; max-width:320px;">
      {% for a in shipping_sheets %}<option value="{% url 'explore:shipment_image' image_id=a.image_id %}?name={{ a.image_name|urlencode }}&amp;inline=1" title="{{ a.image_name }}">{{ a.label }}{% if forloop.first %} — latest{% endif %}</option>{% endfor %}
    </select></label>
  <button type="button" id="pd-sheets-open" style="font:inherit; font-size:13px; font-weight:600; color:var(--dim);
          background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-sm);
          padding:6px 15px; cursor:pointer;">Open</button>
</div>
<script>
document.getElementById("pd-sheets-open").addEventListener("click", function () {
  window.open(document.getElementById("pd-sheets").value, "_blank");
});
</script>
