{% comment %} A column header of an items table that sorts by it: a click sorts ascending, a second descending (?sort=key / ?sort=-key, read by _items_page). hx=1 inside an htmx pane. {% endcomment %}<th><a style="color:inherit;text-decoration:none;white-space:nowrap;" href="?sort={% if parts_page.sort == key %}-{% endif %}{{ key }}"{% if hx %} hx-get="?sort={% if parts_page.sort == key %}-{% endif %}{{ key }}"{% endif %}>{{ label }}{% if parts_page.sort == key %} &#9650;{% elif parts_page.sort == "-"|add:key %} &#9660;{% endif %}</a></th>
