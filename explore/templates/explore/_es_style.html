{# the ES page's styles — shared with the ES config workbench preview (#205) #}
<style>
  .es-page { padding: 22px 30px 56px; }
  .es-crumbs { font-size: 13px; color: var(--dim); margin-bottom: 14px; }
  .es-crumbs a { color: var(--accent-ink); text-decoration: none; }
  .es-crumbs a:hover { text-decoration: underline; }
  .es-crumbs .sep { color: var(--faint); margin: 0 7px; }
  .es-page h1 { font-size: 1.35rem; color: var(--ink); margin: 0 0 2px; }
  .es-page h1 .mono { font-family: var(--font-mono); }
  .es-sub { color: var(--dim); font-size: 13px; margin: 0 0 12px; }

  .es-flash { border-radius: var(--r-lg); padding: 10px 15px; font-size: 13px; margin-bottom: 14px; }
  .es-flash.success { color: var(--good); background: var(--good-bg);
    border: 1px solid color-mix(in oklch, var(--good) 35%, var(--rule)); }
  .es-flash.error { color: var(--bad, #a33); background: color-mix(in oklch, var(--bad, #a33) 8%, var(--page));
    border: 1px solid color-mix(in oklch, var(--bad, #a33) 35%, var(--rule)); overflow-wrap: anywhere; }

  .es-card { border: 1px solid var(--rule); background: var(--page); border-radius: var(--r-lg);
    padding: 12px 16px; margin-bottom: 12px; }
  .es-card h2 { font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em;
    margin: 0 0 8px; }
  .es-hint { font-size: 11.5px; color: var(--faint); }
  .es-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .es-row label { font-size: 12px; color: var(--faint); display: flex; flex-direction: column; gap: 3px; }
  .es-page select, .es-page input[type=text], .es-page textarea { font: inherit; font-size: 13px;
    color: var(--ink); background: var(--surface); border: 1px solid var(--rule);
    border-radius: var(--r-sm); padding: 6px 8px; }
  .es-page input:disabled, .es-page textarea:disabled { opacity: .55; }
  .es-btn { font: inherit; font-size: 13px; font-weight: 600; color: var(--accent-ink);
    background: var(--accent-soft); border: 1px solid color-mix(in oklch, var(--accent) 35%, var(--rule));
    border-radius: var(--r-sm); padding: 6px 15px; cursor: pointer; }
  .es-btn:hover { border-color: var(--accent); }
  .es-btn:disabled { opacity: .45; cursor: default; }
  .es-btn.quiet { color: var(--ink); background: var(--page); border-color: var(--dim); }   /* a secondary action still reads as a button: dark outline, bold — inputs sit on the surface tint, regular weight */
  .es-btn.quiet:hover { border-color: var(--accent); color: var(--accent-ink); }
  .es-btn.quiet:disabled { color: var(--faint); border-color: var(--rule); cursor: default; }
  .es-toggle { display: flex; gap: 6px; margin-top: 6px; }
  .es-toggle .es-btn { font-size: 12px; padding: 2px 8px; }
  .es-toggle .es-btn.is-on { color: var(--accent-ink); border-color: var(--accent-ink); }

  .es-signee { border-top: 1px solid var(--rule); padding: 8px 0; }
  .es-signee:first-of-type { border-top: none; padding-top: 0; }
  .es-signee .who { font-weight: 600; color: var(--ink); font-size: 13.5px; }
  .es-signee .meta { font-size: 11.5px; color: var(--faint); margin-left: 8px; }
  .es-signed { color: var(--good); font-weight: 700; font-size: 12px; }
  .es-waiting { color: var(--faint); font-size: 12px; }
  .es-todo { display: block; font-size: 13px; color: var(--ink); margin: 2px 0; }
  .es-log-table { width: 100%; border-collapse: collapse; font-size: 13px; color: var(--ink); }
  .es-log-table th { text-align: left; font-size: 11px; font-weight: 600; color: var(--faint);
    text-transform: uppercase; letter-spacing: .03em; padding: 0 10px 4px 0;
    border-bottom: 1px solid var(--ink); }
  .es-log-table td { padding: 5px 10px 5px 0; border-bottom: 1px solid var(--rule);
    vertical-align: top; }
  .es-log-table th:last-child, .es-log-table td:last-child { padding-right: 0; width: 45%; }
  .es-log-time { font-size: 12px; color: var(--faint); white-space: nowrap; }
  .es-log-status { color: var(--faint); }
  .es-log-reset { text-align: center; color: var(--faint); font-size: 12px; }
  .es-log-text { white-space: pre-wrap; }
  .es-page textarea { width: 100%; resize: vertical; }
  .es-dl { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500;
    color: var(--good); text-decoration: none; border: 1px solid color-mix(in oklch, var(--good) 35%, var(--rule));
    background: var(--good-bg); border-radius: 999px; padding: 4px 13px; margin: 2px 6px 2px 0; }
  .es-plots-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 0 20px; }
  .es-plot { border-top: 1px solid var(--rule); padding: 8px 0; }
  .es-plot:first-of-type { border-top: none; padding-top: 0; }
  .es-plot-title { font-weight: 600; color: var(--ink); font-size: 13px; margin-bottom: 2px; }
  .es-plot img { max-width: 100%; max-height: 260px; width: auto; height: auto; margin-top: 6px;
    display: block; border: 1px solid var(--rule); border-radius: var(--r-sm); background: #fff; }
  .es-plot-err { font-size: 12.5px; color: var(--bad, #a33); margin-top: 4px; overflow-wrap: anywhere; }
  .es-plot-fields { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
  .es-plot-fields td { padding: 3px 10px 3px 0; border-bottom: 1px solid var(--rule); color: var(--ink);
    overflow-wrap: anywhere; }
  .es-plot-fields td.lab { width: 45%; color: var(--dim); }
  .es-plot-fields td a { color: var(--accent-ink); text-decoration: underline; }
  /* a list of records at a field's path (broken wires) */
  .es-rec { width: 100%; border-collapse: collapse; font-size: 11.5px; margin: 4px 0 2px; }
  .es-rec th { text-align: left; font-weight: 600; color: var(--faint); font-size: 10.5px;
    padding: 0 8px 2px 0; border-bottom: 1px solid var(--ink); }
  .es-rec td { padding: 2px 8px 2px 0; border-bottom: 1px solid var(--rule); color: var(--ink);
    overflow-wrap: anywhere; }
  .es-sum { cursor: pointer; font-size: 12px; color: var(--faint); text-transform: uppercase;
    letter-spacing: .04em; }
  .es-sum:hover { color: var(--dim); }
  /* two columns: everything left, plots right (stacked on narrow windows,
     plots first — matching the reading order: review plots, then sign) */
  .es-cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
    gap: 0 16px; align-items: start; }
  .es-cols.es-one { grid-template-columns: minmax(0, 1fr); max-width: 900px; }
  .es-cols > .es-main { grid-column: 1; grid-row: 1; min-width: 0; }
  .es-cols > .es-side { grid-column: 2; grid-row: 1; min-width: 0;
    position: sticky; top: 12px; }
  @media (max-width: 1100px) {
    .es-cols { grid-template-columns: minmax(0, 1fr); }
    .es-cols > .es-main, .es-cols > .es-side { grid-column: auto; grid-row: auto; position: static; }
  }
  .es-kv { font-size: 13px; color: var(--ink); margin: 3px 0; }
  .es-kv b { font-weight: 600; }
  .es-row select { max-width: 320px; }
  .es-ref { font-size: 13px; margin: 4px 0; overflow-wrap: anywhere; }
  .es-ref a { color: var(--accent-ink); }
  /* required confirmations: red until ticked, green once ticked */
  .es-req { border-left: 3px solid var(--bad, #c0392b); padding-left: 8px;
    color: var(--bad, #a33); accent-color: var(--bad, #c0392b); font-weight: 500; }
  .es-req.is-ok { border-left-color: var(--good); color: var(--good); accent-color: var(--good); }
  /* recursive sub-component tree (htmx-loaded) */
  .es-tree { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .es-tree th { text-align: left; font-size: 11px; color: var(--faint); text-transform: uppercase;
    letter-spacing: .04em; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--rule); }
  .es-tree td { padding: 3px 10px 3px 0; border-bottom: 1px solid var(--rule); color: var(--ink); }
  .es-tree td.mono { font-family: var(--font-mono); font-size: 12px;
    padding-left: calc(var(--depth, 0) * 16px); }
  .es-tree td.mono a { color: var(--accent-ink); text-decoration: none; }
  .es-tree td.mono a:hover { text-decoration: underline; }
  .es-conn { color: var(--faint); font-size: 11px; }
  .es-yes { color: var(--good); font-weight: 600; }
  .es-no { color: var(--bad, #a33); font-weight: 600; }
  .es-spin { display: inline-block; width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--rule); border-top-color: var(--accent-ink);
    animation: es-spin .8s linear infinite; vertical-align: -2px; }
  @keyframes es-spin { to { transform: rotate(360deg); } }
</style>
