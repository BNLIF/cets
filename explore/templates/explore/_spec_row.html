<tr><td class="k">{{ f.label }}</td>
  <td>{% if f.json %}<a href="#" class="sd-jview" title="Click to view">{{ f.value|truncatechars:120 }}</a><template class="sd-jdata" data-label="{{ f.label }}">{{ f.json }}</template>{% elif f.value|length > 300 %}<details class="sd-vfold"><summary><span class="sd-vprev">{{ f.value|truncatechars:160 }}</span></summary><div class="sd-vfull">{{ f.value }}</div></details>{% else %}{{ f.value }}{% endif %}</td>{% if can_delete_spec and f.spec_del %}<td class="sd-delc"><form method="post" action="{% url 'explore:spec_delete' part_id=part_id %}" onsubmit="return confirm('Remove “{{ f.label|escapejs }}” from this item\u2019s Specifications? HWDB keeps no history of the removed key.');">{% csrf_token %}<input type="hidden" name="section" value="{{ f.spec_del.section }}"><input type="hidden" name="label" value="{{ f.spec_del.label }}"><button class="sd-del" title="Remove this row from the item's specifications (architect)">&#x2715;</button></form></td>{% endif %}</tr>
