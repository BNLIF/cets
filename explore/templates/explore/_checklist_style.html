<style>
  /* shared checklist rendering styles (#95/#96) — the fill-out page and the
     editor's live preview both include this block */
  .es-card { border: 1px solid var(--rule); background: var(--page); border-radius: var(--r-lg);
    padding: 12px 16px; margin-bottom: 12px; }
  .es-card h2 { font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em;
    margin: 0 0 8px; }
  .es-hint { font-size: 11.5px; color: var(--faint); }
  /* #98: foldable section headers + select-driven sections */
  .cl-sec h2 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .cl-fold { font: inherit; text-transform: inherit; letter-spacing: inherit; color: inherit;
    background: none; border: 0; padding: 0; cursor: pointer; }
  .cl-fold::before { content: "\25BE"; display: inline-block; width: 20px; font-size: 18px;
    line-height: 1; vertical-align: -2px; color: var(--accent-ink); }
  .cl-folded .cl-fold::before { content: "\25B8"; }
  .cl-folded .cl-sec-body { display: none; }
  .cl-sec h2 .cl-hint { text-transform: none; letter-spacing: 0; }
  .cl-check-item { flex: 0 1 200px !important; align-self: end; }
  .cl-check-item .cl-lab { color: var(--ink); font-size: 13px; }
  .es-btn { font: inherit; font-size: 13px; font-weight: 600; color: var(--accent-ink);
    background: var(--accent-soft); border: 1px solid color-mix(in oklch, var(--accent) 35%, var(--rule));
    border-radius: var(--r-sm); padding: 8px 18px; cursor: pointer; }
  .es-btn:hover { border-color: var(--accent); }
  .es-btn.quiet { color: var(--dim); background: var(--surface); border-color: var(--rule); }

  .cl-field { margin: 10px 0; min-width: 0; }
  .cl-lab { display: block; font-size: 12.5px; color: var(--dim); margin-bottom: 3px; }
  .cl-units, .cl-hint { color: var(--faint); font-size: 11.5px; }
  .cl-row { display: flex; flex-wrap: wrap; gap: 0 22px; }
  .cl-row > .cl-field { flex: 1 1 220px; }
  .cl-field input:not([type=radio]):not([type=checkbox]):not([type=file]),
  .cl-field select, .cl-field textarea { font: inherit; font-size: 13px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-sm);
    padding: 7px 9px; width: 100%; max-width: 360px; }
  .cl-field textarea { max-width: 100%; }
  .cl-qr input, .cl-link input { font-family: var(--font-mono); max-width: 260px; }
  .cl-ok { border-color: var(--good) !important; background: var(--good-bg) !important; }
  .cl-bad { border-color: var(--bad, #a33) !important;
    background: color-mix(in oklch, var(--bad, #a33) 10%, var(--surface)) !important; }
  .cl-tri { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--r-sm);
    overflow: hidden; background: var(--surface); }
  .cl-tri-opt { position: relative; }
  .cl-tri-opt input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .cl-tri-opt span { display: block; padding: 7px 18px; font-size: 14px; color: var(--faint);
    border-left: 1px solid var(--rule); }
  .cl-tri-opt:first-child span { border-left: none; }
  .cl-tri-opt input:checked + span { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
  .cl-tri-opt.ok input:checked + span { background: var(--good-bg); color: var(--good); }
  .cl-tri-opt.bad input:checked + span {
    background: color-mix(in oklch, var(--bad, #a33) 12%, var(--surface)); color: var(--bad, #a33); }
  .tbl-scroll { overflow-x: auto; }
  .cl-table { border-collapse: collapse; font-size: 13px; }
  .cl-table th { font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase;
    padding: 2px 8px 4px; border-bottom: 1px solid var(--rule); text-align: center; }
  .cl-table td { padding: 5px 4px; }
  .cl-table td input { width: 86px; text-align: center; }
  .cl-table td input[readonly] { background: var(--page); border-style: dashed; }  /* computed (#109) */
  .cl-steps { margin: 4px 0 0; padding-left: 4px; font-size: 13.5px; color: var(--ink);
    list-style: none; counter-reset: clstep; }
  .cl-steps li { margin: 5px 0; }
  /* #106: indented sub-steps (leading spaces in the schema, 2 per level);
     only top-level steps count in the numbering, sub-steps get dashes */
  .cl-steps > li:not([class]) { counter-increment: clstep; }
  .cl-steps > li:not([class])::before { content: counter(clstep) ".\a0"; color: var(--faint); }
  .cl-steps li[class^="cl-step-l"]::before { color: var(--faint); }
  .cl-steps .cl-step-l1 { margin-left: 26px; }
  .cl-steps .cl-step-l1::before { content: "\2013\a0"; }   /* – */
  .cl-steps .cl-step-l2 { margin-left: 52px; }
  .cl-steps .cl-step-l2::before { content: "\2022\a0"; }   /* • */
  .cl-steps .cl-step-l3 { margin-left: 78px; }
  .cl-steps .cl-step-l3::before { content: "\25E6\a0"; }   /* ◦ */
  .cl-steps .cl-step-l4 { margin-left: 104px; }
  .cl-steps .cl-step-l4::before { content: "\25AA\a0"; }   /* ▪ */
  .cl-static-img { max-width: 100%; max-height: 320px; border: 1px solid var(--rule);
    border-radius: var(--r-sm); }
  /* #107: the "view drawing" stand-in for a PDF reference (viewer: _lightbox.html) */
  .cl-lb-pdfbtn { font: inherit; font-size: 13px; color: var(--accent-ink);
    background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-sm);
    padding: 7px 12px; cursor: pointer; }
  /* #113: clickable image map — numbered dots over the drawing, one slot each */
  .cl-map { position: relative; display: inline-block; max-width: 100%; }
  .cl-map img { display: block; max-width: 100%; max-height: 440px;
    border: 1px solid var(--rule); border-radius: var(--r-sm); cursor: zoom-in; }
  /* zoomed map view (tap the drawing): full resolution, slots still tappable */
  .cl-mapzoom { border: 1px solid var(--rule); border-radius: var(--r-sm);
    padding: 10px; background: var(--surface); color: var(--ink); }
  .cl-mapzoom::backdrop { background: rgba(0, 0, 0, .45); }
  .cl-mz-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .cl-mz-scroll { overflow: auto; max-width: 90vw; max-height: 80vh; }
  .cl-mz-wrap { position: relative; width: fit-content; }
  .cl-mz-wrap img { display: block; max-width: none; max-height: none; }
  .cl-map-dot { position: absolute; transform: translate(-50%, -50%);
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; padding: 0 4px; border-radius: 11px;
    font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer;
    color: var(--accent-ink); background: transparent;
    border: 2px solid var(--accent-ink);
    text-shadow: 0 0 3px var(--surface), 0 0 3px var(--surface); }
  .cl-map-dot.on { color: var(--good); border-color: var(--good); }
  .cl-map-list { display: grid; gap: 6px 14px; margin-top: 8px;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .cl-map-slot { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  .cl-map-slot label { flex: 0 1 auto; white-space: nowrap; }
  .cl-map-slot input { flex: 1 1 90px; min-width: 0; font-family: var(--font-mono); }
  .cl-map-n { flex: 0 0 auto; color: var(--faint); font-size: 11.5px; min-width: 16px;
    text-align: right; }
  .cl-note { font-size: 13px; color: var(--ink); }
  .cl-field a { color: var(--accent-ink); }
  /* the Take-photo button only works where capture= opens a camera app —
     desktops ignore it (it would just re-open the file picker), so it only
     shows on touch devices */
  .cl-photo-cam { display: none; }
  @media (pointer: coarse) {
    .cl-tri-opt span { padding: 10px 20px; }
    .cl-steps li { margin: 9px 0; }
    .cl-photo-cam { display: inline-block; }
  }
  /* #105: print / save-as-PDF — the browser's print dialog is the PDF
     engine. Folded sections open, app chrome and buttons vanish; the
     pre-filled values print inside their boxes (a blank checklist prints
     as a blank procedure sheet). */
  @media print {
    .eh-header, .ex-side, .ex-scrim, .es-btn, .cl-photo-cam, .es-flash,
    .es-crumbs, .es-hint, input[type=file] { display: none !important; }
    .ex-layout { display: block; }
    .es-page { padding: 0; max-width: none; }
    .cl-folded .cl-sec-body { display: block; }
    .cl-sec[data-when-key][hidden] { display: block; }  /* every variant prints */
    .cl-fold::before { content: ""; width: 0; }
    .es-card { border-color: #bbb; }
    .cl-field { break-inside: avoid; }
    .cl-field input:not([type=radio]):not([type=checkbox]):not([type=file]),
    .cl-field select, .cl-field textarea, .cl-tri { background: none; border-color: #bbb; }
    .cl-static-img { max-height: none; border: none; }
  }
</style>
