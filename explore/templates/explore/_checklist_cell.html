{# One table cell (#109/#114/#116/#119/#139) — included per column inside the row loop, so forloop.counter0 is the column index. #}{% if c.check %}<td{% if c.color %} class="cl-tint" style="--cl-tint: {{ c.color }};"{% endif %}><div class="cl-tri cl-tri-sm" role="radiogroup" aria-label="{{ c.column }}">
      <label class="cl-tri-opt"><input type="radio" name="{{ c.name }}" value=""{% if not c.value %} checked{% endif %}><span>&mdash;</span></label>
      <label class="cl-tri-opt ok"><input type="radio" name="{{ c.name }}" value="pass"{% if c.value == "pass" %} checked{% endif %}><span>&#10003;</span></label>
      <label class="cl-tri-opt bad"><input type="radio" name="{{ c.name }}" value="fail"{% if c.value == "fail" %} checked{% endif %}><span>&#10007;</span></label>
    </div></td>{% elif c.text %}<td class="cl-const{% if c.text|length > 24 %} cl-wrap{% endif %}{% if c.color %} cl-tint{% endif %}"{% if c.color %} style="--cl-tint: {{ c.color }};"{% endif %}><span data-ci="{{ forloop.counter0 }}" data-const>{{ c.text }}</span></td>{% else %}<td{% if c.color %} class="cl-tint" style="--cl-tint: {{ c.color }};"{% endif %}><input name="{{ c.name }}" value="{{ c.value }}" inputmode="decimal" autocomplete="off" data-ci="{{ forloop.counter0 }}"
      {% if c.formula %}readonly tabindex="-1" data-formula="{{ c.formula }}" title="= {{ c.formula }}"{% endif %}
      {% if c.min != None %}data-min="{{ c.min|stringformat:"g" }}"{% endif %}
      {% if c.max != None %}data-max="{{ c.max|stringformat:"g" }}"{% endif %}></td>{% endif %}
